<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cliff Formation Viewer</title>
<style>
  body { margin:0; overflow:hidden; background:#1a1a1a; font-family: sans-serif; }
  #info { position:absolute; top:10px; left:10px; color:#ddd; background:rgba(0,0,0,0.6); padding:12px 16px; border-radius:8px; max-width:420px; z-index:10; }
  #info h2 { margin:0 0 8px 0; font-size:18px; color:#fff; }
  #info p { margin:4px 0; font-size:13px; line-height:1.4; }
  #info code { background:rgba(255,255,255,0.1); padding:2px 4px; border-radius:3px; }
  #controls { position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.6); padding:10px; border-radius:8px; z-index:10; }
  #controls button { margin:2px; padding:6px 10px; background:#333; color:#ddd; border:1px solid #555; border-radius:4px; cursor:pointer; }
  #controls button.active { background:#5a8dee; color:white; }
  canvas { display:block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="info">
  <h2>Cliff Formation Generator</h2>
  <p><b>Pipeline:</b> Macro → Bedding & Joints (offset) → Chipping → Erosion → Cracks</p>
  <p><b>Constraints:</b> No noise, only triangles, geological fracture sets, hybrid Polygon/SDF</p>
  <p>Drag to orbit, scroll to zoom. Untextured shows silhouette.</p>
  <p id="stats">Loading...</p>
  <p style="font-size:10px; color:#888;">If 404, click RawGithack or Local below</p>
</div>
<div id="controls">
  <button id="btnLocal" class="active">Local /obj/</button>
  <button id="btnRaw">RawGithack CDN</button>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e2329);
scene.fog = new THREE.Fog(0x1e2329, 40, 120);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 500);
camera.position.set(18, 12, 22);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(16, 8, -3);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 80;

const ambient = new THREE.AmbientLight(0xffffff, 0.35);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xfff4e0, 1.2);
dirLight.position.set(15, 25, 12);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048,2048);
dirLight.shadow.camera.left = -25; dirLight.shadow.camera.right = 25;
dirLight.shadow.camera.top = 25; dirLight.shadow.camera.bottom = -15;
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0x8ab4ff, 0.4);
fillLight.position.set(-10, 12, -8);
scene.add(fillLight);

const groundGeo = new THREE.PlaneGeometry(100,100);
const groundMat = new THREE.MeshStandardMaterial({ color:0x2a2f36, roughness:0.9, metalness:0.05 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.02;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(100, 50, 0x444444, 0x333333);
grid.position.y = 0.01;
scene.add(grid);

const loader = new OBJLoader();
const statsEl = document.getElementById('stats');
let currentObj = null;
let useRaw = false;

function getUrls(file) {
  const rawBase = "https://raw.githack.com/darkenigmainbox/Frontier/arena/01a1089a-frontier/";
  const urls = [];
  if (useRaw) urls.push(rawBase + file);
  urls.push('/obj/' + file);
  urls.push('/' + file);
  urls.push('./' + file);
  urls.push(file);
  urls.push('/generated/' + file);
  if (!useRaw) urls.push(rawBase + file);
  return urls;
}

function loadWithFallback(file, urls, idx=0) {
  if (idx >= urls.length) {
    statsEl.textContent = `Failed ${file}: all URLs failed`;
    return;
  }
  const url = urls[idx];
  statsEl.textContent = `Loading ${file} via ${url}...`;
  loader.load(url, (obj) => {
    let verts=0, tris=0;
    obj.traverse(c => {
      if (c.isMesh) {
        const g=c.geometry;
        g.computeVertexNormals();
        verts+=g.attributes.position.count;
        tris+=g.index ? g.index.count/3 : g.attributes.position.count/3;
        c.material = new THREE.MeshStandardMaterial({ color:0xc9bba3, roughness:0.85, metalness:0.02, side:THREE.DoubleSide });
        c.castShadow=true; c.receiveShadow=true;
      }
    });
    if (currentObj) scene.remove(currentObj);
    const box = new THREE.Box3().setFromObject(obj);
    const center = box.getCenter(new THREE.Vector3());
    controls.target.copy(center);
    controls.target.y = box.min.y + (box.max.y-box.min.y)*0.5;
    scene.add(obj);
    currentObj=obj;
    statsEl.textContent = `Loaded ${file} via ${url}: ${verts.toLocaleString()} verts, ${Math.round(tris).toLocaleString()} tris`;
  }, (xhr) => {
    if (xhr.lengthComputable) {
      const pct = (xhr.loaded/xhr.total*100).toFixed(1);
      statsEl.textContent = `Loading ${file} ${pct}% via ${url}`;
    }
  }, (err) => {
    console.warn(`Failed ${url}, trying next`);
    loadWithFallback(file, urls, idx+1);
  });
}

function loadCliff(file) {
  loadWithFallback(file, getUrls(file), 0);
}

document.getElementById('btnLocal').addEventListener('click', () => {
  useRaw=false;
  document.getElementById('btnLocal').classList.add('active');
  document.getElementById('btnRaw').classList.remove('active');
  loadCliff('cliff.obj');
});
document.getElementById('btnRaw').addEventListener('click', () => {
  useRaw=true;
  document.getElementById('btnRaw').classList.add('active');
  document.getElementById('btnLocal').classList.remove('active');
  loadCliff('cliff.obj');
});

loadCliff('cliff.obj');

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
