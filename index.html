<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontier — Realtime Water</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif; }
      canvas#view { display: block; width: 100vw; height: 100vh; outline: none; }
      #hud { position: fixed; left: 14px; top: 12px; color: #e8f1f5; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.6); max-width: 360px; }
      #hud h1 { font-size: 15px; margin: 0 0 4px; letter-spacing: .08em; font-weight: 700; }
      #hud .mode { font-size: 12px; color: #9fe3ff; margin-bottom: 6px; }
      #hud .keys { font-size: 11.5px; line-height: 1.55; background: rgba(5, 15, 22, .45); padding: 8px 10px; border-radius: 8px; backdrop-filter: blur(4px); }
      #hud kbd { background: rgba(255,255,255,.14); border-radius: 4px; padding: 0 5px; font-family: inherit; font-size: 11px; }
      #stats { position: fixed; left: 14px; bottom: 12px; color: #cfe7f0; font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; pointer-events: none; text-shadow: 0 1px 2px #000; }
      #error { display: none; position: fixed; inset: 0; color: #fff; background: #111; padding: 40px; font-size: 15px; line-height: 1.6; }
      #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #cfe7f0; background: #071219; font-size: 14px; letter-spacing: .1em; }
    </style>
  </head>
  <body>
    <canvas id="view" tabindex="0"></canvas>
    <div id="hud">
      <h1>FRONTIER · REALTIME WATER</h1>
      <div class="mode" id="mode"></div>
      <div class="keys">
        <kbd>W</kbd><kbd>S</kbd> throttle · <kbd>A</kbd><kbd>D</kbd> steer · <kbd>Shift</kbd> boost<br />
        <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> switch splash solver (FLIP / SPH / Whitewater)<br />
        Click water = splash · <kbd>R</kbd> drop rock · <kbd>F</kbd> toggle 3D foam<br />
        Drag = orbit · Wheel = zoom · <kbd>Backspace</kbd> reset boat · <kbd>H</kbd> hide help
      </div>
    </div>
    <div id="stats"></div>
    <div id="error"></div>
    <div id="loading">GENERATING ISLAND…</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
