<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FRONTIER — Automotive Material Studio</title>
<meta name="description" content="Real-time procedural automotive materials: metallic flake paint, brake discs, ceramics, fabric, rubber and glass. No textures." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='30%25' cy='20%25' r='95%25'%3E%3Cstop offset='0' stop-color='%23ffb066'/%3E%3Cstop offset='45%25' stop-color='%23ff7a2f'/%3E%3Cstop offset='100%25' stop-color='%23a83f0c'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%23141619'/%3E%3Crect x='6' y='6' width='20' height='20' rx='6' fill='url(%23g)'/%3E%3Crect x='9' y='9' width='14' height='5' rx='2.5' fill='%23fff' opacity='.55'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/src/styles/theme.css" />
<link rel="stylesheet" href="/src/styles/layout.css" />
<link rel="stylesheet" href="/src/styles/components.css" />
<link rel="stylesheet" href="/src/styles/icons.css" />
</head>
<body>

<div id="app">

	<!-- ============================== TOP BAR ============================== -->
	<header class="topbar">
		<div class="brand">
			<span class="brand-mark"></span>
			<span class="brand-name">Frontier</span>
			<span class="brand-sub">Automotive Material Studio</span>
		</div>

		<nav class="asset-rail" id="assetRail" aria-label="Viewport asset"></nav>

		<span class="topbar-spacer"></span>

		<div id="topActions" style="display:flex;align-items:center;gap:6px;"></div>
	</header>

	<!-- ============================== LIBRARY ============================== -->
	<aside id="libraryHost"></aside>

	<!-- ============================== STAGE ================================ -->
	<main class="stage" id="stage">
		<canvas id="viewport"></canvas>

		<div class="hud hud-tl">
			<div class="hud-chip" style="display:block;">
				<div class="hud-title" id="hudTitle">Body Panel</div>
				<div class="hud-crumb">
					<span id="hudSlot">Outer Panel</span>
					<span class="dot"></span>
					<span id="hudFamily" class="u-mono">paint</span>
					<span class="dot"></span>
					<span id="hudModel">Clear Coat + Flake</span>
				</div>
			</div>
			<div class="hud-chip" id="hudHoverChip" style="display:none;">
				<span class="k">hover</span><span class="v acc" id="hudHover">—</span>
			</div>
		</div>

		<div class="hud hud-tr">
			<div class="hud-stack">
				<div class="hud-chip"><span class="k">fps</span><span class="v cy" id="hudFps">—</span></div>
				<div class="hud-chip"><span class="k">tris</span><span class="v" id="hudTris">—</span></div>
				<div class="hud-chip"><span class="k">calls</span><span class="v" id="hudCalls">—</span></div>
			</div>
		</div>

		<div class="hud hud-bl">
			<div class="hud-chip">
				<span class="k">hint</span>
				<span class="v" style="font-family:var(--font);font-size:10px;color:var(--text-2)">
					Click a part of the model to retarget the library &amp; inspector
				</span>
			</div>
		</div>

		<div class="hud hud-bc"><div class="vp-toolbar" id="vpToolbar"></div></div>

		<canvas class="gizmo" id="gizmo" width="124" height="124"></canvas>

		<div class="veil" id="veil">
			<div class="eyebrow" style="color:var(--text-2)">Compiling procedural shaders</div>
			<div class="veil-bar"><i></i></div>
		</div>
	</main>

	<!-- ============================== INSPECTOR ============================ -->
	<aside id="inspectorHost"></aside>

	<!-- ============================== DRAWER =============================== -->
	<section class="drawer" id="drawer">
		<div class="drawer-tabs" id="drawerTabs"></div>
		<div class="drawer-body" id="drawerBody"></div>
	</section>

	<!-- ============================== STATUS =============================== -->
	<footer class="statusbar" id="statusbar"></footer>
</div>

<div class="popover" id="renderPop"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
