<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cliff Stages Viewer</title>
<style>
  body { margin:0; overflow:hidden; background:#1a1a1a; font-family: sans-serif; }
  #info { position:absolute; top:10px; left:10px; color:#ddd; background:rgba(0,0,0,0.6); padding:12px 16px; border-radius:8px; max-width:440px; }
  #info h2 { margin:0 0 8px 0; font-size:18px; color:#fff; }
  #controls { position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.6); padding:12px; border-radius:8px; color:#ddd; }
  #controls select, #controls button { margin:4px; padding:6px 10px; background:#333; color:#ddd; border:1px solid #555; border-radius:4px; }
  canvas { display:block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="info">
  <h2>Cliff Pipeline Stages</h2>
  <p>1: Macro shape (authored planes, no noise)<br>
     2: Bedding (strata)<br>
     3: Fractured (bedding + joints with offset)<br>
     4: Edge chipped<br>
     5: Eroded (SDF shrink)<br>
     6: Final HQ (chipped + eroded + surface cracks via SDF)</p>
  <p id="stats">Loading...</p>
</div>
<div id="controls">
  <label>Stage: </label>
  <select id="stageSelect">
    <option value="stage1_macro.obj">1 - Macro</option>
    <option value="stage2_bedding.obj">2 - Bedding</option>
    <option value="stage3_fractured.obj">3 - Fractured</option>
    <option value="stage4_chipped.obj">4 - Chipped</option>
    <option value="stage5_eroded.obj">5 - Eroded</option>
    <option value="cliff.obj" selected>6 - Final (voxel 0.09)</option>
    <option value="cliff_hq.obj">6 - Final HQ (voxel 0.07)</option>
  </select>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e2329);
scene.fog = new THREE.Fog(0x1e2329, 40, 120);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 500);
camera.position.set(18, 12, 22);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(16, 8, -3);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

const ambient = new THREE.AmbientLight(0xffffff, 0.35);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xfff4e0, 1.2);
dirLight.position.set(15, 25, 12);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048,2048);
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0x8ab4ff, 0.4);
fillLight.position.set(-10, 12, -8);
scene.add(fillLight);

const groundGeo = new THREE.PlaneGeometry(100,100);
const groundMat = new THREE.MeshStandardMaterial({ color:0x2a2f36, roughness:0.9 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.02;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(100, 50, 0x444444, 0x333333);
grid.position.y = 0.01;
scene.add(grid);

const loader = new OBJLoader();
const statsEl = document.getElementById('stats');
let currentObj = null;

function loadStage(path) {
  if (currentObj) scene.remove(currentObj);
  statsEl.textContent = `Loading ${path}...`;
  loader.load(path, (obj) => {
    let totalVerts = 0, totalTris = 0;
    obj.traverse((child) => {
      if (child.isMesh) {
        const geom = child.geometry;
        geom.computeVertexNormals();
        totalVerts += geom.attributes.position.count;
        totalTris += geom.index ? geom.index.count/3 : geom.attributes.position.count/3;
        child.material = new THREE.MeshStandardMaterial({
          color: path.includes('cliff') ? 0xc9bba3 : 0x9aa0a6,
          roughness: 0.85,
          metalness: 0.02,
          side: THREE.DoubleSide
        });
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });
    const box = new THREE.Box3().setFromObject(obj);
    const center = box.getCenter(new THREE.Vector3());
    controls.target.copy(center);
    controls.target.y = box.min.y + (box.max.y - box.min.y)*0.5;
    scene.add(obj);
    currentObj = obj;
    statsEl.textContent = `${path}: ${totalVerts.toLocaleString()} verts, ${Math.round(totalTris).toLocaleString()} tris`;
  }, undefined, (err) => {
    statsEl.textContent = `Failed ${path}: ${err}`;
  });
}

document.getElementById('stageSelect').addEventListener('change', (e) => {
  loadStage(e.target.value);
});

loadStage('cliff.obj');

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
