<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TerrainSequence — WebGPU terrain</title>
<link rel="stylesheet" href="TerrainSequence.css">
</head>
<body>
<div id="Editor">
  <div class="workspace">

    <!-- Viewport -->
    <section class="viewport">
      <div class="viewport-toolbar">
        <div class="viewport-heading-row">
          <div class="viewport-identity">
            <span class="viewport-mark">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#cfcfcf"
                   stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 19.5 9 7l4.2 7.1"/><path d="M8.6 19.5h13.1L15.4 8.6l-3 5"/>
              </svg>
            </span>
            <div>
              <strong>TerrainSequence</strong>
              <span data-subtitle>Heightfield, erosion and texturing on the GPU</span>
            </div>
          </div>
          <div class="viewport-modes" data-modes role="tablist"></div>
        </div>
        <div class="viewport-action-row">
          <button class="primary" data-act="rebuild">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
                 stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="M3 13l9 5 9-5"/>
            </svg>
            <span>Rebuild</span>
          </button>
          <button class="icon" data-act="frame" title="Frame the terrain">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                 stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/>
            </svg>
          </button>
          <span class="viewport-divider"></span>
          <span class="viewport-picker">
            <label for="PresetBar">Preset</label>
            <select id="PresetBar" data-preset></select>
          </span>
          <div class="viewport-secondary">
            <button class="icon" data-act="console" aria-pressed="false" title="Diagnostics">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                   stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 7l5 5-5 5"/><path d="M13 17h6"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div class="canvas-wrap">
        <canvas id="Viewport"></canvas>
        <div class="badge-build"><i></i><span>Ready</span></div>
        <div class="console">
          <header>Diagnostics<button>Close</button></header>
          <div class="lines"></div>
        </div>
        <div class="progress-rail"><i></i></div>
      </div>

      <footer class="viewport-footer" data-stats></footer>
    </section>

    <!-- Right dock: the stacks above, the inspector below -->
    <aside class="dock right">
      <section class="stack"></section>
      <div class="splitter"></div>
      <section class="inspector"></section>
    </aside>

  </div>
</div>

<div class="sheet" hidden>
  <div class="sheet-body">
    <h2>Add a layer</h2>
    <p></p>
    <div class="kind-grid"></div>
    <div class="sheet-foot"><button data-close>Cancel</button></div>
  </div>
</div>

<script type="module" src="TerrainHost.js"></script>
</body>
</html>
